name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:guards
      - run: pnpm test

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Misma versión que el devDependency `supabase` de package.json: súbelas a la vez.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: supabase start
      - run: pnpm test:db
      # Los tipos versionados tienen que ser los que salen de las migraciones. Mismo patrón
      # que los tokens en check:guards: regenerar y exigir que no cambie nada.
      - name: Comprobar que database.types.ts está al día
        run: |
          pnpm db:types
          git diff --exit-code src/lib/database.types.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Misma versión que el devDependency `supabase` de package.json: súbelas a la vez.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - run: supabase start
      - name: Volcar supabase status a .env.local
        run: |
          set -euo pipefail
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a
          # CLI nuevos publican PUBLISHABLE_KEY / SECRET_KEY; los antiguos, ANON_KEY / SERVICE_ROLE_KEY.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-${ANON_KEY}}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-${SECRET_KEY}}"
          } > .env.local
      - run: pnpm seed
      - run: pnpm test:int
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Pase lo que pase antes: el informe HTML y, de cada test fallido, su traza. Las
      # sesiones guardadas (e2e/.auth/) quedan fuera.
      - name: Subir el informe y las trazas de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
